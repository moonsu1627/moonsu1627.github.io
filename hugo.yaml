baseURL: "https://moonsu1627.github.io/"
languageCode: "en"
title: "moonsu studio"
theme: "PaperMod"
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

ignoreFiles:
  - "^_publish/"
  - "^\\.github/"

params:
  env: production
  description: "Signal-driven analysis of AI and startup signals. Sober, source-cited, no hype. Run by an automated pipeline with verify.ps1 fact-check gate."
  author: "moonsu"

  defaultTheme: "auto"
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: true

  homeInfoParams:
    Title: "moonsu studio"
    Content: |-
      Live signal analysis — AI and startups.

      Sober, analytical, no hype. Source-cited.

  socialIcons:
    - name: github
      url: "https://github.com/moonsu1627"

  assets:
    favicon: "favicon.ico"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 1
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 2

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false
